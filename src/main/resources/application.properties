# ================= DATASOURCE CONFIG =================
spring.datasource.url=jdbc:mysql://localhost:3306/clothingstore?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP — fail fast with a clear error if DB is unreachable
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1
# Pool sizing — headroom for concurrent requests. The default of 10 was being
# exhausted; a couple of dead connections will surface as leak warnings now.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.leak-detection-threshold=30000

# Disable open-session-in-view (Spring warns it's enabled by default).
# With long-lived SSE streams (/notifications/stream), OSIV pinned one JDBC
# connection per open stream for the stream's full lifetime, exhausting the pool.
# Read paths that render lazy associations now fetch them explicitly via @EntityGraph.
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.mvc.hiddenmethod.filter.enabled=true

# ================= EMAIL CONFIG =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nguyennhatminh1811@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ================= SESSION CONFIG =================
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.platform=mysql
spring.session.timeout=24h

# ================= LOGGING CONFIG =================
logging.level.org.hibernate.SQL=WARN
logging.level.com.shop.clothingstore=DEBUG

# ================= CACHE CONFIG =================
spring.cache.type=caffeine

# ================= JWT CONFIG =================
# Required in runtime environments. Tests provide their own value under src/test/resources.
jwt.secret=${JWT_SECRET:DayLaSecretChiDungChoLocalDevKhongDungProduction}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
jwt.expiration=86400000

# ================= GRACEFUL SHUTDOWN =================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ================= ACTUATOR =================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true

# ================= ASYNC CONFIG =================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# ================= CHATBOT AI (Google Gemini) =================
# AI-first sales assistant with function calling (queries the live product DB).
# Get a FREE API key at https://aistudio.google.com/apikey and set GEMINI_API_KEY.
# If the key is missing, the chatbot degrades gracefully to a best-seller fallback.
chatbot.ai.enabled=${CHATBOT_AI_ENABLED:true}
chatbot.ai.timeout-ms=${CHATBOT_AI_TIMEOUT_MS:15000}
chatbot.ai.cooldown-seconds=${CHATBOT_AI_COOLDOWN_SECONDS:300}
chatbot.ai.gemini-api-key=${GEMINI_API_KEY:}
chatbot.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
chatbot.ai.gemini-base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# ================= FILE STORAGE =================
# Store uploads outside of src/ so they are not bundled into the JAR/classpath.
# Path is relative to the working directory (project root) when running locally.
upload.dir=uploads

# ================= VIRTUAL TRY-ON CONFIG =================
tryon.python.url=${TRYON_PYTHON_URL:http://localhost:8081}

# Set to 'true' to use offline mock instead of real inference (development only)
tryon.mock=${MOCK_INFERENCE:false}
