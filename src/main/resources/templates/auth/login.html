<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content}, 'Login — Nova')}">

<div th:fragment="content">
<style>
#announcementBar,
#siteHeader,
#mobileHeader {
    display: none !important;
}
main {
    padding-top: 0 !important;
}
.auth-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #d4d4d8;
    color: #1c1b19;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.05em;
    padding: 12px 0;
    outline: none;
    transition: border-color 0.2s;
}
.auth-input:focus {
    border-bottom-color: #71717a;
    outline: none !important;
    box-shadow: none !important;
}
.auth-label {
    font-size: 0.78rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #1c1b19;
    display: block;
    margin-bottom: 4px;
}
body:has(.auth-shell) #announcementBar,
body:has(.auth-shell) #siteHeader,
body:has(.auth-shell) #mobileHeader,
body:has(.auth-shell) footer {
    display: none !important;
}
.auth-shell { min-height: 100vh !important; background: #ffffff; }
.auth-panel { width: min(100%, 560px) !important; }
@media (max-width: 1279px) {
    .auth-shell {
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        min-height: 100vh !important;
    }
    .auth-panel {
        width: 100% !important;
        max-width: 480px !important;
        min-height: auto !important;
        padding: 48px 24px !important;
        border-left: 0 !important;
    }
    .auth-panel > div:first-child { margin-bottom: 28px !important; }
    .auth-panel h1 { font-size: 2.8rem !important; line-height: 1 !important; }
    .auth-panel form { gap: 24px !important; }
    .auth-label { letter-spacing: .25em; font-size: .78rem; }
    .auth-input { font-size: 1rem; padding: 12px 0; }
    .auth-input::placeholder { font-size: .78rem; }
    .auth-panel button[type="submit"] { min-height: 48px; width: 100%; }
    .auth-panel form > div:nth-of-type(3) {
        flex-direction: row !important;
        align-items: center !important;
        justify-content: space-between !important;
        gap: 12px !important;
    }
}
</style>

<div class="auth-shell" style="min-height: 100vh; display:flex; align-items:stretch;">

    <!-- LEFT: BRANDING (warm bone) -->
    <div style="flex: 1; background:#1c1b19; color:#ffffff; padding:64px; position:relative; overflow:hidden; border-right:1px solid #e4e4e7;" class="hidden xl:flex xl:flex-col xl:justify-end">
        <div style="font-family:'Bebas Neue',sans-serif; font-size:7rem; line-height:0.85; letter-spacing:0.04em; color:#ffffff; margin-bottom:48px; pointer-events:none; user-select:none;">NOVA<br>ESSENTIALS</div>
        <p style="font-size:0.78rem; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:#ffffff; line-height:2;">Streetwear for the<br>modern generation.</p>
    </div>

    <!-- RIGHT: FORM (light) -->
    <div class="auth-panel" style="width:min(100%, 560px); flex-shrink:0; display:flex; flex-direction:column; justify-content:center; padding:64px 64px; background:#ffffff; border-left:1px solid #e4e4e7;">

        <div style="margin-bottom:48px;">
            <p style="font-size:0.78rem; letter-spacing:0.45em; text-transform:uppercase; color:#1c1b19; margin-bottom:12px;">Account</p>
            <h1 style="font-family:'Bebas Neue',sans-serif; font-size:3rem; letter-spacing:0.05em; line-height:1; color:#1c1b19;">Sign In</h1>
        </div>

        <!-- ERROR / SUCCESS -->
        <div th:if="${param.error}" role="alert" aria-live="assertive" style="background:#ffffff; border:1px solid #8a3e34; color:#8a3e34; font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase; padding:12px 16px; margin-bottom:32px;">
            Invalid email or password
        </div>
        <div th:if="${param.logout}" role="status" aria-live="polite" style="background:#ffffff; border:1px solid #4f6b46; color:#4f6b46; font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase; padding:12px 16px; margin-bottom:32px;">
            Signed out successfully
        </div>

        <form method="post" th:action="@{/login}" style="display:flex; flex-direction:column; gap:32px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div>
                <label class="auth-label" for="loginEmail">Email</label>
                <input id="loginEmail" type="email" name="username" placeholder="your@email.com" required autocomplete="email" class="auth-input" />
            </div>

            <div>
                <label class="auth-label" for="loginPassword">Password</label>
                <input id="loginPassword" type="password" name="password" placeholder="Password" required autocomplete="current-password" class="auth-input" />
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" name="remember-me"
                           style="width:14px; height:14px; border:1px solid #d4d4d8; background:transparent; cursor:pointer; accent-color:#1c1b19;" />
                    <span style="font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase; color:#1c1b19;">Remember Me</span>
                </label>
                <a th:href="@{/forgot-password}" style="font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase; color:#1c1b19; text-decoration:none; transition:color 0.2s;" onmouseover="this.style.color='#1c1b19'" onmouseout="this.style.color='#1c1b19'">Forgot Password?</a>
            </div>

            <button type="submit" style="
                background: #1c1b19;
                color: #ffffff;
                border: none;
                padding: 16px;
                font-family: 'Be Vietnam Pro', sans-serif;
                font-size:0.85rem;
                letter-spacing: 0.25em;
                text-transform: uppercase;
                font-weight: 500;
                cursor: pointer;
                transition: background 0.25s;
                margin-top: 8px;
            " onmouseover="this.style.background='#000'" onmouseout="this.style.background='#1c1b19'">Sign In</button>
        </form>

        <div style="margin-top:40px; padding-top:32px; border-top:1px solid #e4e4e7;">
            <p style="font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase; color:#1c1b19; text-align:center;">
                New here?
                <a th:href="@{/register}" style="color:#1c1b19; text-decoration:none; margin-left:8px; transition:color 0.2s;" onmouseover="this.style.color='#1c1b19'" onmouseout="this.style.color='#1c1b19'">Create Account →</a>
            </p>
        </div>
    </div>
</div>
</div>
</html>
