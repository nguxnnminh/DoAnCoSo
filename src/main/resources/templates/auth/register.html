<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content}, 'Register — Nova')}">

<div th:fragment="content">
<style>
#announcementBar,
#siteHeader,
#mobileHeader {
    display: none !important;
}
main {
    padding-top: 0 !important;
}
.auth-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #d4d4d8;
    color: #1c1b19;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.05em;
    padding: 12px 0;
    outline: none;
    transition: border-color 0.2s;
}
.auth-input:focus {
    border-bottom-color: #71717a;
    outline: none !important;
    box-shadow: none !important;
}
.auth-label {
    font-size: 0.78rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #1c1b19;
    display: block;
    margin-bottom: 4px;
}
body:has(.auth-shell) #announcementBar,
body:has(.auth-shell) #siteHeader,
body:has(.auth-shell) #mobileHeader,
body:has(.auth-shell) footer {
    display: none !important;
}
.auth-shell { min-height: 100vh !important; background: #ffffff; }
.auth-panel { width: min(100%, 560px) !important; }
@media (max-width: 1279px) {
    .auth-shell {
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        min-height: 100vh !important;
    }
    .auth-panel {
        width: 100% !important;
        max-width: 480px !important;
        min-height: auto !important;
        padding: 48px 24px !important;
        border-left: 0 !important;
    }
    .auth-panel > div:first-child { margin-bottom: 28px !important; }
    .auth-panel h1 { font-size: 2.8rem !important; line-height: 1 !important; }
    .auth-panel form { gap: 24px !important; }
    .auth-label { letter-spacing: .25em; font-size: .78rem; }
    .auth-input { font-size: 1rem; padding: 12px 0; }
    .auth-input::placeholder { font-size: .78rem; }
    .auth-panel button[type="submit"] { min-height: 48px; width: 100%; }
}
</style>

<div class="auth-shell" style="min-height: 100vh; display:flex; align-items:stretch;">

    <!-- LEFT: BRANDING (warm field) -->
    <div style="flex: 1; background:#1c1b19; color:#ffffff; padding:64px; position:relative; overflow:hidden; border-right:1px solid #e4e4e7;" class="hidden xl:flex xl:flex-col xl:justify-end">
        <div style="font-family:'Bebas Neue',sans-serif; font-size:7rem; line-height:0.85; letter-spacing:0.04em; color:#ffffff; margin-bottom:48px; pointer-events:none; user-select:none;">NOVA<br>ESSENTIALS</div>
        <p style="font-size:0.78rem; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:#ffffff; line-height:2;">Streetwear for the<br>modern generation.</p>
    </div>

    <!-- RIGHT: FORM (light) -->
    <div class="auth-panel" style="width:min(100%, 560px); flex-shrink:0; display:flex; flex-direction:column; justify-content:center; padding:64px 64px; background:#ffffff; border-left:1px solid #e4e4e7;">

        <div style="margin-bottom:48px;">
            <p style="font-size:0.78rem; letter-spacing:0.45em; text-transform:uppercase; color:#1c1b19; margin-bottom:12px;">Join Nova</p>
            <h1 style="font-family:'Bebas Neue',sans-serif; font-size:3rem; letter-spacing:0.05em; line-height:1; color:#1c1b19;">Create Account</h1>
        </div>

        <form method="post" th:action="@{/register}" id="regForm" style="display:flex; flex-direction:column; gap:32px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <!-- Mã giới thiệu (referral) — truyền qua ?ref=CODE, gửi kèm khi đăng ký -->
            <input type="hidden" name="ref" th:value="${ref}" th:if="${ref != null}" />

            <div>
                <label class="auth-label" for="registerEmail">Email</label>
                <input id="registerEmail" type="email" name="email" placeholder="your@email.com" required autocomplete="email" class="auth-input" />
            </div>

            <div>
                <label class="auth-label" for="pw">Password</label>
                <input type="password" name="password" id="pw" placeholder="Min 8 characters" required autocomplete="new-password" class="auth-input" />
            </div>

            <div>
                <label class="auth-label" for="cpw">Confirm Password</label>
                <input type="password" name="confirmPassword" id="cpw" placeholder="Repeat password" required autocomplete="new-password" class="auth-input" aria-describedby="pwErr" />
                <p id="pwErr" role="alert" aria-live="assertive" style="font-size:0.8rem; letter-spacing:0.1em; color:#8a3e34; margin-top:8px; display:none;">Passwords do not match</p>
            </div>

            <button type="submit" id="subBtn" style="
                background: #1c1b19;
                color: #ffffff;
                border: none;
                padding: 16px;
                font-family: 'Be Vietnam Pro', sans-serif;
                font-size:0.85rem;
                letter-spacing: 0.25em;
                text-transform: uppercase;
                font-weight: 500;
                cursor: pointer;
                transition: background 0.25s;
                margin-top: 8px;
            " onmouseover="this.style.background='#000'" onmouseout="this.style.background='#1c1b19'">Create Account</button>
        </form>

        <div style="margin-top:40px; padding-top:32px; border-top:1px solid #e4e4e7;">
            <p style="font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase; color:#1c1b19; text-align:center;">
                Already a member?
                <a th:href="@{/login}" style="color:#1c1b19; text-decoration:none; margin-left:8px; transition:color 0.2s;" onmouseover="this.style.color='#1c1b19'" onmouseout="this.style.color='#1c1b19'">Sign In →</a>
            </p>
        </div>
    </div>
</div>

<script>
    const pw = document.getElementById('pw'), cpw = document.getElementById('cpw'), err = document.getElementById('pwErr'), btn = document.getElementById('subBtn');
    function validate() { const ok = pw.value === cpw.value; err.style.display = ok ? 'none' : 'block'; btn.disabled = !ok; }
    pw.addEventListener('input', validate); cpw.addEventListener('input', validate);
    document.getElementById('regForm').addEventListener('submit', function(e) { if (pw.value !== cpw.value) e.preventDefault(); });
</script>
</div>
</html>
