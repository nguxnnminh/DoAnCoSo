<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content}, 'My Coupons — Nova')}">
<div th:fragment="content">
  <style>
    /* ===== COUPON CARD ===== */
    .coupon-card {
      border: 1px solid var(--c-hairline);
      background: #fafafa;
      padding: 0;
      display: flex;
      overflow: hidden;
      transition: border-color .25s, transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s;
      position: relative;
      will-change: transform;
    }
    .coupon-card:hover {
      border-color: var(--c-hairline-strong);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(22,20,15,0.06);
      background: #f4f4f5;
    }
    .coupon-card.is-used, .coupon-card.is-expired {
      opacity: 0.55;
      pointer-events: none;
    }
    .coupon-card.is-used:hover, .coupon-card.is-expired:hover {
      transform: none;
      box-shadow: none;
      border-color: var(--c-hairline);
    }

    /* Left accent strip */
    .coupon-accent {
      width: 6px;
      flex-shrink: 0;
      background: var(--c-hairline-strong);
    }
    .coupon-card.is-used .coupon-accent,
    .coupon-card.is-expired .coupon-accent {
      background: var(--c-hairline);
    }
    .coupon-card.is-welcome .coupon-accent {
      background: linear-gradient(180deg, #ffd700, #ff8c00);
    }

    /* Card body */
    .coupon-body {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Discount value — big display */
    .coupon-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.04em;
      color: var(--c-ink);
      line-height: 1;
    }

    .coupon-code {
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d4a843;
      font-family: 'DM Mono', monospace;
      background: #ffffff;
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid var(--c-hairline);
      border-radius: 2px;
    }

    .coupon-desc {
      font-size: 0.82rem;
      color: var(--c-ink-soft);
      line-height: 1.5;
    }

    .coupon-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .coupon-meta-item {
      font-size:0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--c-ink-soft);
    }

    /* Badges */
    .badge {
      display: inline-block;
      font-size:0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid;
    }
    .badge-available { border-color: var(--c-hairline-strong); color: var(--c-ink-soft); }
    .badge-used { border-color: var(--c-hairline); color: var(--c-hairline-strong); }
    .badge-expired { border-color: var(--c-error); color: var(--c-error); background: rgba(138, 62, 52, 0.05); }
    .badge-recommended {
      border-color: #4a4a2a;
      color: #d4a843;
      background: rgba(212, 168, 67, 0.08);
    }

    /* Filter tabs */
    .filter-tab {
      font-size:0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--c-ink-soft);
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
      background: none;
    }
    .filter-tab:hover { color: var(--c-ink); border-color: var(--c-hairline-strong); }
    .filter-tab.active { color: var(--c-ink); border-color: var(--c-hairline-strong); background: var(--c-bg-alt); }

    /* Sort dropdown */
    .sort-select {
      background: #ffffff;
      border: 1px solid var(--c-hairline);
      color: var(--c-ink);
      font-size:0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 8px 12px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }
    .sort-select:focus { border-color: var(--c-hairline-strong); }


    @media (max-width: 640px) {
      .coupon-body { padding: 16px; }
      .coupon-value { font-size: 1.4rem; }
      .coupon-meta { gap: 10px; }
    }
  </style>

  <div class="max-w-[1400px] mx-auto px-4 md:px-8 lg:px-12 py-10 md:py-16">

    <!-- HEADER -->
    <div class="flex justify-between items-end mb-8 md:mb-12 border-b border-[var(--c-hairline)] pb-6 md:pb-8">
      <div>
        <p class="text-xs tracking-widest3 uppercase text-zinc-600 mb-2">Account</p>
        <h1 class="font-display text-4xl md:text-6xl tracking-wide leading-none text-[#1c1b19]">My Coupons</h1>
      </div>
      <p class="text-xs tracking-widest uppercase text-zinc-500">
        <span th:text="${totalAvailable}">0</span>&nbsp;Available
      </p>
    </div>

    <!-- FILTER & SORT -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
      <div class="flex flex-wrap gap-2">
        <a th:href="@{/my-coupons(filter='all', sort=${sort})}"
           class="filter-tab" th:classappend="${filter == 'all'} ? 'active'">All</a>
        <a th:href="@{/my-coupons(filter='available', sort=${sort})}"
           class="filter-tab" th:classappend="${filter == 'available'} ? 'active'">Available</a>
        <a th:href="@{/my-coupons(filter='used', sort=${sort})}"
           class="filter-tab" th:classappend="${filter == 'used'} ? 'active'">Used</a>
        <a th:href="@{/my-coupons(filter='expired', sort=${sort})}"
           class="filter-tab" th:classappend="${filter == 'expired'} ? 'active'">Expired</a>
      </div>

      <form method="get" th:action="@{/my-coupons}" class="flex items-center gap-2">
        <input type="hidden" name="filter" th:value="${filter}" />
        <label class="text-[0.68rem] tracking-widest uppercase text-zinc-600">Sort:</label>
        <select name="sort" class="sort-select" onchange="this.form.submit()">
          <option value="best" th:selected="${sort == 'best'}">Best Discount</option>
          <option value="expiring" th:selected="${sort == 'expiring'}">Expiring Soon</option>
        </select>
      </form>
    </div>

    <!-- COUPON LIST -->
    <div th:if="${#lists.isEmpty(coupons)}" class="text-center py-20 md:py-28">
      <p class="font-display text-5xl md:text-7xl tracking-wide text-zinc-700 mb-3">No Coupons Yet</p>
      <p class="text-xs tracking-widest uppercase text-zinc-700 mb-8">You don't have any coupons available.</p>
      <a th:href="@{/products}"
         class="h-11 md:h-12 px-8 bg-[#1c1b19] text-[#ffffff] text-xs tracking-widest uppercase
                no-underline font-medium inline-flex items-center transition-colors duration-200 hover:bg-[#1c1b19] hover:text-[#ffffff]">
        Browse Shop
      </a>
    </div>

    <div th:unless="${#lists.isEmpty(coupons)}" class="flex flex-col gap-3">
      <div th:each="coupon, iter : ${coupons}"
           class="coupon-card"
           th:classappend="${coupon.used ? 'is-used' : ''} + ' ' + ${coupon.expired ? 'is-expired' : ''} + ' ' + ${coupon.userSpecific ? 'is-welcome' : ''}">

        <div class="coupon-accent"></div>

        <div class="coupon-body">
          <!-- Top row: Value + Badges -->
          <div class="flex items-start justify-between gap-3">
            <div>
              <span class="coupon-value" th:text="${coupon.discountDisplay}">100,000₫</span>
            </div>
            <div class="flex gap-2 flex-shrink-0 flex-wrap justify-end">
              <span th:if="${iter.index == 0 and coupon.usable and filter != 'used' and filter != 'expired'}"
                    class="badge badge-recommended">★ Recommended</span>
              <span th:if="${coupon.usable}" class="badge badge-available">Available</span>
              <span th:if="${coupon.used}" class="badge badge-used">Used</span>
              <span th:if="${coupon.expired and !coupon.used}" class="badge badge-expired">Expired</span>
            </div>
          </div>

          <!-- Code -->
          <div>
            <span class="coupon-code" th:text="${coupon.code}">WELCOME-ABC123</span>
          </div>

          <!-- Description -->
          <p th:if="${coupon.description}" class="coupon-desc" th:text="${coupon.description}"></p>

          <!-- Meta info -->
          <div class="coupon-meta">
            <span th:if="${coupon.minOrderAmount != null}" class="coupon-meta-item">
              Min. order: <span th:text="${#numbers.formatDecimal(coupon.minOrderAmount, 0, 'POINT', 0, 'COMMA')}">200,000</span>₫
            </span>
            <span th:if="${coupon.expiryDate != null}" class="coupon-meta-item">
              Exp: <span th:text="${#temporals.format(coupon.expiryDate, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
            </span>
            <span th:if="${coupon.startDate != null and !coupon.started}" class="coupon-meta-item">
              Starts: <span th:text="${#temporals.format(coupon.startDate, 'dd/MM/yyyy')}">01/01/2026</span>
            </span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</html>
