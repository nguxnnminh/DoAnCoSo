<!DOCTYPE html>
<!-- Modal fragment for create / edit User. Uses ${user}. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div data-modal-content th:fragment="form">

    <div class="modal-form-header">
        <div>
            <h2 th:text="${isEdit} ? 'Edit Customer' : 'Add User'">Add User</h2>
            <p th:text="${isEdit} ? ('ID #' + ${user.id}) : 'Create an admin-managed customer or admin account'">…</p>
        </div>
        <button type="button" class="modal-close-btn" data-modal-close aria-label="Close">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <div class="modal-form-body">
        <form data-modal-form data-validate th:object="${user}"
              th:action="${isEdit} ? @{/admin/users/{id}(id=${user.id})} : @{/admin/users/create}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div style="display:flex; flex-direction:column; gap:18px;">

                <div>
                    <label class="form-label">Email <span th:if="${!isEdit}" style="color:#ef4444;">*</span></label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:readonly="${isEdit}"
                           th:data-required="${isEdit} ? null : 'email'"
                           placeholder="customer@example.com" autocomplete="email"
                           th:style="${isEdit} ? 'background:#f9fafb; color:#9ca3af; cursor:not-allowed;' : ''">
                    <p class="form-hint" th:if="${isEdit}">Email cannot be changed</p>
                </div>

                <!-- Password fields: create only -->
                <div th:if="${!isEdit}" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div>
                        <label class="form-label">Password <span style="color:#ef4444;">*</span></label>
                        <input type="password" name="password" class="form-control"
                               data-required="password" minlength="8" autocomplete="new-password">
                        <p class="form-hint">Minimum 8 characters</p>
                    </div>
                    <div>
                        <label class="form-label">Confirm Password <span style="color:#ef4444;">*</span></label>
                        <input type="password" name="confirmPassword" class="form-control"
                               data-required="password confirmation" minlength="8" autocomplete="new-password">
                    </div>
                </div>

                <div>
                    <label class="form-label">Full Name <span th:if="${isEdit}" style="color:#ef4444;">*</span></label>
                    <input th:field="*{fullName}" class="form-control" placeholder="e.g. John Smith">
                </div>

                <div>
                    <label class="form-label">Phone Number</label>
                    <input th:field="*{phone}" class="form-control" placeholder="0901234567">
                </div>

                <div>
                    <label class="form-label">Address</label>
                    <textarea th:field="*{address}" rows="3" class="form-control" placeholder="Shipping address..."></textarea>
                </div>

                <div>
                    <label class="form-label">Role</label>
                    <select th:field="*{role}" class="form-control">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                    <p class="form-hint">Use ADMIN only for trusted staff accounts.</p>
                </div>

                <div class="divider"></div>

                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        <span th:text="${isEdit} ? 'Save Changes' : 'Create User'">Create User</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

</div>

</body>
</html>
