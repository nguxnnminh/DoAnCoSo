<!DOCTYPE html>
<!--
  Modal fragment for create / edit Category.
  Rendered standalone (AJAX) and injected into #ajaxModalBox by admin-modal.js.
  The [data-modal-content] wrapper is what the modal extracts.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div data-modal-content th:fragment="form">

    <div class="modal-form-header">
        <div>
            <h2 th:text="${isEdit} ? 'Edit Category' : 'Add Category'">Add Category</h2>
            <p th:text="${isEdit} ? 'Update this category' : 'Create a new category for products'">…</p>
        </div>
        <button type="button" class="modal-close-btn" data-modal-close aria-label="Close">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <div class="modal-form-body">
        <form data-modal-form data-validate
              th:action="${isEdit} ? @{/admin/categories/{id}(id=${category.id})} : @{/admin/categories/create}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div style="display:flex; flex-direction:column; gap:18px;">
                <div>
                    <label class="form-label">Category Name <span style="color:#ef4444;">*</span></label>
                    <input type="text" name="name" id="catNameInput" class="form-control"
                           data-required="category name"
                           th:value="${category.name}"
                           placeholder="VD: Top, Bottom, Accessories..."
                           maxlength="100" oninput="catAutoSlug(this.value)">
                </div>

                <div>
                    <label class="form-label">Slug</label>
                    <input type="text" name="slug" id="catSlugInput" class="form-control"
                           th:value="${category.slug}"
                           placeholder="tu-dong-tao-tu-ten"
                           style="font-family:monospace; font-size:13px;">
                    <p class="form-hint">Leave blank to auto-generate. Lowercase, numbers and hyphens only.</p>
                </div>

                <div class="divider"></div>

                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        <span th:text="${isEdit} ? 'Save Changes' : 'Create Category'">Create Category</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        (function () {
            const slugField = document.getElementById('catSlugInput');
            if (slugField && slugField.value) slugField.dataset.manual = 'true';
            window.catAutoSlug = function (name) {
                const f = document.getElementById('catSlugInput');
                if (!f || f.dataset.manual) return;
                f.value = name.toLowerCase()
                    .normalize('NFD').replace(/[̀-ͯ]/g, '')
                    .replace(/[đĐ]/g, 'd')
                    .replace(/[^a-z0-9\s-]/g, '')
                    .replace(/\s+/g, '-').replace(/-+/g, '-');
            };
            if (slugField) slugField.addEventListener('input', function () { this.dataset.manual = 'true'; });
        })();
    </script>

</div>

</body>
</html>
