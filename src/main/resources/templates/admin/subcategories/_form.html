<!DOCTYPE html>
<!-- Modal fragment for create / edit SubCategory. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div data-modal-content th:fragment="form">

    <div class="modal-form-header">
        <div>
            <h2 th:text="${isEdit} ? 'Edit Subcategory' : 'Add Subcategory'">Add Subcategory</h2>
            <p th:text="${isEdit} ? ('ID #' + ${subCategory.id}) : 'Create a subcategory under a main category'">…</p>
        </div>
        <button type="button" class="modal-close-btn" data-modal-close aria-label="Close">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <div class="modal-form-body">
        <form data-modal-form data-validate
              th:action="${isEdit} ? @{/admin/subcategories/{id}(id=${subCategory.id})} : @{/admin/subcategories/create}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div style="display:flex; flex-direction:column; gap:18px;">
                <div>
                    <label class="form-label">Subcategory Name <span style="color:#ef4444;">*</span></label>
                    <input type="text" name="name" id="subNameInput" class="form-control"
                           data-required="subcategory name"
                           th:value="${isEdit} ? ${subCategory.name} : ''"
                           placeholder="VD: Tee, Hoodie, Jeans..."
                           maxlength="100" oninput="subAutoSlug(this.value)">
                </div>

                <div>
                    <label class="form-label">Main Category <span style="color:#ef4444;">*</span></label>
                    <select name="categoryId" class="form-control" data-required="main category">
                        <option value="">-- Select main category --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${isEdit} ? (${subCategory.category?.id} == ${cat.id}) : (${preselectedCategoryId} == ${cat.id})"></option>
                    </select>
                </div>

                <div>
                    <label class="form-label">Size Type</label>
                    <select name="sizeType" class="form-control">
                        <option value="">-- None --</option>
                        <option th:each="st : ${sizeTypes}"
                                th:value="${st}" th:text="${st}"
                                th:selected="${isEdit} ? (${subCategory.sizeType} == ${st}) : false"></option>
                    </select>
                    <p class="form-hint">LETTER = S/M/L, NUMBER = 38/39/40, FREE = One size</p>
                </div>

                <div>
                    <label class="form-label">Slug</label>
                    <input type="text" name="slug" id="subSlugInput" class="form-control"
                           th:value="${isEdit} ? ${subCategory.slug} : ''"
                           placeholder="tu-dong-tao-tu-ten"
                           style="font-family:monospace; font-size:13px;">
                    <p class="form-hint">Leave blank to auto-generate.</p>
                </div>

                <div class="divider"></div>

                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        <span th:text="${isEdit} ? 'Save Changes' : 'Create Subcategory'">Create Subcategory</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        (function () {
            const slugField = document.getElementById('subSlugInput');
            if (slugField && slugField.value) slugField.dataset.manual = 'true';
            window.subAutoSlug = function (name) {
                const f = document.getElementById('subSlugInput');
                if (!f || f.dataset.manual) return;
                f.value = name.toLowerCase()
                    .normalize('NFD').replace(/[̀-ͯ]/g, '')
                    .replace(/[đĐ]/g, 'd')
                    .replace(/[^a-z0-9\s-]/g, '')
                    .replace(/\s+/g, '-').replace(/-+/g, '-');
            };
            if (slugField) slugField.addEventListener('input', function () { this.dataset.manual = 'true'; });
        })();
    </script>

</div>

</body>
</html>
