org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Tắt Kotlin incremental compilation: tránh bug "different roots" khi project (D:)
# và Pub cache (C:) nằm khác ổ đĩa trên Windows — trình incremental của Kotlin
# crash khi tính đường dẫn tương đối giữa hai ổ đĩa khác nhau.
kotlin.incremental=false
